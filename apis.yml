x-coverage:
  state: covered
  reason: covered
  detail: >-
    KazNU is one of the few institutions in this cohort with a genuinely institution-operated,
    publicly readable API. Its self-hosted Open edX platform at open.kaznu.kz publishes a live
    Swagger 2.0 contract (HTTP 200, 375 KB, 284 paths, 47 service groups) whose servers block,
    contact address (dl@kaznu.kz) and KazNU-specific `univertest` service group all place operation
    with the institution rather than with a vendor tenancy. The course catalog endpoint answers
    unauthenticated with 510 courses. Seven Open Journal Systems OAI-PMH repositories on kaznu.kz
    hosts answer Identify and ListSets. A Moodle web-services endpoint is enabled at
    dl.kaznu.edu.kz on the institution's second domain. What is absent is the developer contract
    around all of it — no developer portal, no authentication or rate-limit documentation, no SDKs,
    no changelog, no status page. No identity federation exists to record: SAML metadata 404s and
    Kazakhstan has no eduGAIN-participating national federation. No DataCite membership exists;
    DOIs are minted through Crossref under prefix 10.26577. One pointer was removed as dead — the
    main www.kaznu.kz site has served an expired wildcard TLS certificate (expired 2026-05-04)
    since May 2026 and is unreachable over HTTPS, though it still answers over plain HTTP. The OJS journal portal has a second defect: the
    be.kaznu.kz site root and its locale-neutral /index.php/index path both enter an infinite
    redirect loop (curl exhausts 50 hops), so only explicitly locale-qualified journal URLs
    such as /index.php/math/en resolve. The OAI-PMH endpoints underneath are unaffected.
