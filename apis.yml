---
aid: al-farabi-kazakh-national-university
name: Al-Farabi Kazakh National University
description: >-
  Al-Farabi Kazakh National University (KazNU) is Kazakhstan's leading public research university,
  founded in 1934 in Almaty and ranked in the QS World University Rankings top 200. Unlike most of
  this cohort, KazNU does operate a genuine institution-owned programmable surface: a self-hosted
  Open edX platform at open.kaznu.kz that publishes a live Swagger 2.0 contract covering 284 paths
  across 47 service groups, including a publicly readable course catalog (510 courses, no
  authentication required) and LTI 1.3 Advantage grade and roster services. The deployment carries
  the institution's own contact address (dl@kaznu.kz) and a KazNU-specific `univertest` service
  group, so it is their operation and not a vendor tenancy. Alongside it the university runs seven
  Open Journal Systems OAI-PMH repositories for its Bulletin (Vestnik) journal series on kaznu.kz
  hosts, a Moodle distance-learning platform with web services enabled at dl.kaznu.edu.kz, an IRBIS
  library catalog at lib.kaznu.kz, and a Crossref membership under its own DOI prefix 10.26577.
  What KazNU does not have is a developer program: there is no developer portal, no published
  authentication guide, no rate-limit or terms-of-use document for the APIs, no SDKs, and no
  identity-federation metadata — Kazakhstan has no eduGAIN-participating federation. The main
  www.kaznu.kz site has additionally been serving an expired TLS certificate since May 2026. The
  programmable footprint here is real but accidental: it is what the software they installed
  happens to expose, published without any surrounding developer contract.
