description: >-
  Al-Farabi Kazakh National University (KazNU) is the leading public research
  university in Kazakhstan, headquartered in Almaty, and is ranked #163 in the
  QS World University Rankings 2025. The institution operates a public web
  presence across kaznu.kz and farabi.university, an electronic library portal
  (elibrary.kaznu.kz), and an open courseware / MOOC platform (open.kaznu.kz).
  As of this review no public, documented developer portal or open API was
  found; the institution's digital footprint is primarily web properties and
  internal information systems, so this profile catalogs the verified public
  properties rather than any open developer endpoints.
