      library (elibrary.kaznu.kz) and MOOC platform (open.kaznu.kz) resolve
      (HTTP 200), but probed OAI-PMH and DSpace/REST paths returned 404 / no
      response. No official institutional GitHub organization exists; the
      NLP-KazNU org is a research-lab source-code presence rather than an
      official API program. The LinkedIn school page exists (LinkedIn returns
      a 999 anti-bot code to automated probes). Catalog records only verified
      public web properties; no endpoints were fabricated.
