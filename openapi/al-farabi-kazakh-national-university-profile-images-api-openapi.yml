openapi: 3.2.0
info:
  title: Open edX Profile Images API
  description: APIs for access to Open edX information
  contact:
    email: dl@kaznu.kz
  version: v1
servers:
- url: https://open.kaznu.kz/api
security:
- Basic: []
tags:
- name: profile images
paths:
  /profile_images/v1/{username}/remove:
    post:
      operationId: profile_images_v1_remove_create
      description: POST /api/profile_images/v1/{username}/remove
      tags:
      - profile images
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
      summary: Profile images v1 remove create
      x-summary-source: derived
  /profile_images/v1/{username}/upload:
    post:
      operationId: profile_images_v1_upload_create
      description: POST /api/profile_images/v1/{username}/upload
      tags:
      - profile images
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
      summary: Profile images v1 upload create
      x-summary-source: derived
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
