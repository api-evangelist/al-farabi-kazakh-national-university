openapi: 3.0.3
info:
  title: Open edX agreements profile_images API
  description: APIs for access to Open edX information
  contact:
    email: dl@kaznu.kz
  version: v1
servers:
- url: https://open.kaznu.kz/api
security:
- Basic: []
tags:
- name: profile_images
paths:
  /profile_images/v1/{username}/remove:
    post:
      operationId: profile_images_v1_remove_create
      description: POST /api/profile_images/v1/{username}/remove
      tags:
      - profile_images
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
  /profile_images/v1/{username}/upload:
    post:
      operationId: profile_images_v1_upload_create
      description: POST /api/profile_images/v1/{username}/upload
      tags:
      - profile_images
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
