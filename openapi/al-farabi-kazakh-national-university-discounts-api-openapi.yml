openapi: 3.2.0
info:
  title: Open edX Discounts API
  description: APIs for access to Open edX information
  contact:
    email: dl@kaznu.kz
  version: v1
servers:
- url: https://open.kaznu.kz/api
security:
- Basic: []
tags:
- name: Discounts
paths:
  /discounts/course/{course_key_string}:
    get:
      operationId: discounts_course_read
      description: Return the discount percent, if the user has appropriate permissions.
      tags:
      - Discounts
      parameters:
      - name: course_key_string
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: Discounts course read
      x-summary-source: derived
  /discounts/user/{user_id}/course/{course_key_string}:
    get:
      operationId: discounts_user_course_read
      description: Return the discount percent, if the user has appropriate permissions.
      tags:
      - Discounts
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: course_key_string
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: Discounts user course read
      x-summary-source: derived
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
