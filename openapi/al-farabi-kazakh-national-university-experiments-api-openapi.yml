openapi: 3.2.0
info:
  title: Open edX Experiments API
  description: APIs for access to Open edX information
  contact:
    email: dl@kaznu.kz
  version: v1
servers:
- url: https://open.kaznu.kz/api
security:
- Basic: []
tags:
- name: Experiments
paths:
  /experiments/v0/custom/REV-934/:
    get:
      operationId: experiments_v0_custom_REV-934_list
      description: Return the if the course should be upsold in the mobile app, if the user has appropriate permissions.
      tags:
      - Experiments
      responses:
        '200':
          description: ''
      summary: Experiments v0 custom REV 934 list
      x-summary-source: derived
  /experiments/v0/custom/userMetadata/{username},{course_id}:
    get:
      operationId: experiments_v0_custom_userMetadata_read
      description: Return user-metadata for the given course and user
      tags:
      - Experiments
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: course_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: Experiments v0 custom user metadata read
      x-summary-source: derived
  /experiments/v0/data/:
    get:
      operationId: experiments_v0_data_list
      description: ''
      tags:
      - Experiments
      parameters:
      - name: page
        in: query
        required: false
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperimentData'
      summary: Experiments v0 data list
      x-summary-source: derived
    post:
      operationId: experiments_v0_data_create
      description: ''
      tags:
      - Experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentDataCreate'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDataCreate'
      summary: Experiments v0 data create
      x-summary-source: derived
    put:
      operationId: experiments_v0_data_update
      description: ''
      tags:
      - Experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentData'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentData'
      summary: Experiments v0 data update
      x-summary-source: derived
  /experiments/v0/data/{id}/:
    get:
      operationId: experiments_v0_data_read
      description: ''
      tags:
      - Experiments
      parameters:
      - name: id
        in: path
        required: true
        description: A unique integer value identifying this Experiment Data.
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentData'
      summary: Experiments v0 data read
      x-summary-source: derived
    put:
      operationId: experiments_v0_data_update
      description: ''
      tags:
      - Experiments
      parameters:
