  /course_home/outline/{course_key_string}:
    get:
      operationId: course_home_outline_read
      summary: '**Use Cases**'
      description: "Request details for the Outline Tab\n\n**Example Requests**\n\n\
        \    GET api/course_home/v1/outline/{course_key}\n\n**Response Values**\n\n\
        \    Body consists of two possible shapes.\n\n    For a good 200 response,\
        \ the response will include:\n\n    access_expiration: An object detailing\
        \ when access to this course will expire\n        expiration_date: (str) When\
        \ the access expires, in ISO 8601 notation\n        masquerading_expired_course:\
        \ (bool) Whether this course is expired for the masqueraded user\n       \
        \ upgrade_deadline: (str) Last chance to upgrade, in ISO 8601 notation (or\
        \ None if can't upgrade anymore)\n        upgrade_url: (str) Upgrade link\
        \ (or None if can't upgrade anymore)\n    course_blocks:\n        blocks:\
        \ List of serialized Course Block objects. Each serialization has the following\
        \ fields:\n            id: (str) The usage ID of the block.\n            type:\
        \ (str) The type of block. Possible values the names of any\n            \
        \    XBlock type in the system, including custom blocks. Examples are\n  \
        \              course, chapter, sequential, vertical, html, problem, video,\
        \ and\n                discussion.\n            display_name: (str) The display\
        \ name of the block.\n            lms_web_url: (str) The URL to the navigational\
        \ container of the\n                xBlock on the web LMS.\n            children:\
        \ (list) If the block has child blocks, a list of IDs of\n               \
        \ the child blocks.\n            resume_block: (bool) Whether the block is\
        \ the resume block\n            has_scheduled_content: (bool) Whether the\
        \ block has more content scheduled for the future\n    course_goals:\n   \
        \     selected_goal:\n            days_per_week: (int) The number of days\
        \ the learner wants to learn per week\n            subscribed_to_reminders:\
        \ (bool) Whether the learner wants email reminders about their goal\n    \
        \    weekly_learning_goal_enabled: Flag indicating if this feature is enabled\
        \ for this call\n    course_tools: List of serialized Course Tool objects.\
        \ Each serialization has the following fields:\n        analytics_id: (str)\
        \ The unique id given to the tool.\n        title: (str) The display title\
        \ of the tool.\n        url: (str) The link to access the tool.\n    dates_banner_info:\
        \ (obj)\n        content_type_gating_enabled: (bool) Whether content type\
        \ gating is enabled for this enrollment.\n        missed_deadlines: (bool)\
        \ Whether the user has missed any graded content deadlines for the given course.\n\
        \        missed_gated_content: (bool) Whether the user has missed any gated\
        \ content for the given course.\n        verified_upgrade_link: (str) The\
        \ URL to ecommerce IDA for purchasing the verified upgrade.\n    dates_widget:\n\
        \        course_date_blocks: List of serialized Course Dates objects. Each\
        \ serialization has the following fields:\n            complete: (bool) Meant\
        \ to only be used by assignments. Indicates completeness for an\n        \
        \    assignment.\n            date: (datetime) The date time corresponding\
        \ for the event\n            date_type: (str) The type of date (ex. course-start-date,\
        \ assignment-due-date, etc.)\n            description: (str) The description\
        \ for the date event\n            learner_has_access: (bool) Indicates if\
        \ the learner has access to the date event\n            link: (str) An absolute\
        \ link to content related to the date event\n                (ex. verified\
        \ link or link to assignment)\n            title: (str) The title of the date\
        \ event\n        dates_tab_link: (str) The URL to the Dates Tab\n        user_timezone:\
        \ (str) The timezone of the given user\n    enroll_alert:\n        can_enroll:\
        \ (bool) Whether the user can enroll in the given course\n        extra_text:\
        \ (str)\n    enrollment_mode: (str) Current enrollment mode. Null if the user\
        \ is not enrolled.\n    handouts_html: (str) Raw HTML for the handouts section\
        \ of the course info\n    has_ended: (bool) Indicates whether course has ended\n\
        \    offer: An object detailing upgrade discount information\n        code:\
        \ (str) Checkout code\n        expiration_date: (str) Expiration of offer,\
        \ in ISO 8601 notation\n        original_price: (str) Full upgrade price without\
        \ checkout code; includes currency symbol\n        discounted_price: (str)\
        \ Upgrade price with checkout code; includes currency symbol\n        percentage:\
        \ (int) Amount of discount\n        upgrade_url: (str) Checkout URL\n    resume_course:\n\
        \        has_visited_course: (bool) Whether the user has ever visited the\
        \ course\n        url: (str) The display name of the course block to resume\n\
        \    welcome_message_html: (str) Raw HTML for the course updates banner\n\
        \    user_has_passing_grade: (bool) Whether the user currently is passing\
        \ the course\n\n    If the learner does not have access to the course for\
        \ a specific reason and should be redirected this\n    view will return a\
        \ 403 and the following data:\n\n    url: (str) The URL to which the user\
        \ should be redirected\n    error_code: (str) A system identifier for the\
        \ reason the user is being redirected\n    developer_message: (str) A message\
        \ explaining why the user is being redirected,\n                         \
        \    intended for developer debugging.\n    user_message: (str) A message\
        \ explaining why the user is being redirected, intended to be shown to the\
        \ user.\n\n**Returns**\n\n    * 200 on success.\n    * 403 if the user does\
        \ not currently have access to the course and should be redirected.\n    *\
        \ 404 if the course is not available or cannot be seen."
      tags:
      - course_home
      parameters:
      - name: course_key_string
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlineTab'
  /course_home/progress/{course_key_string}:
    get:
      operationId: course_home_progress_read
      summary: '**Use Cases**'
      description: "Request details for the Progress Tab\n\n**Example Requests**\n\
        \n    GET api/course_home/v1/progress/{course_key}\n    GET api/course_home/v1/progress/{course_key}/{student_id}/\n\
        \n**Response Values**\n\n    Body consists of the following fields:\n\n  \
        \  access_expiration: An object detailing when access to this course will\
        \ expire\n        expiration_date: (str) When the access expires, in ISO 8601\
        \ notation\n        masquerading_expired_course: (bool) Whether this course\
        \ is expired for the masqueraded user\n        upgrade_deadline: (str) Last\
        \ chance to upgrade, in ISO 8601 notation (or None if can't upgrade anymore)\n\
        \        upgrade_url: (str) Upgrade link (or None if can't upgrade anymore)\n\
        \    certificate_data: Object containing information about the user's certificate\
        \ status\n        cert_status: (str) the status of a user's certificate (full\
        \ list of statuses are defined in\n                     lms/djangoapps/certificates/models.py)\n\
        \        cert_web_view_url: (str) the url to view the certificate\n      \
        \  download_url: (str) the url to download the certificate\n    completion_summary:\
        \ Object containing unit completion counts with the following fields:\n  \
        \      complete_count: (float) number of complete units\n        incomplete_count:\
        \ (float) number of incomplete units\n        locked_count: (float) number\
        \ of units where contains_gated_content is True\n    course_grade: Object\
        \ containing the following fields:\n        is_passing: (bool) whether the\
        \ user's grade is above the passing grade cutoff\n        letter_grade: (str)\
        \ the user's letter grade based on the set grade range.\n                \
        \            If user is passing, value may be 'A', 'B', 'C', 'D', 'Pass',\
        \ otherwise none\n        percent: (float) the user's total graded percent\
        \ in the course\n    credit_course_requirements: Object containing credit\
        \ course requirements with the following fields:\n        eligibility_status:\
        \ (str) Indicates if the user is eligible to receive credit. Value may be\n\
        \            \"eligible\", \"not_eligible\", or \"partial_eligible\"\n   \
        \     requirements: List of requirements that must be fulfilled to be eligible\
        \ to receive credit. See\n            `get_credit_requirement_status` for\
        \ details on the fields\n    end: (date) end date of the course\n    enrollment_mode:\
        \ (str) a str representing the enrollment the user has ('audit', 'verified',\
        \ ...)\n    grading_policy:\n        assignment_policies: List of serialized\
        \ assignment grading policy objects, each has the following fields:\n    \
        \        num_droppable: (int) the number of lowest scored assignments that\
        \ will not be counted towards the final\n                           grade\n\
        \            short_label: (str) the abbreviated name given to the assignment\
        \ type\n            type: (str) the assignment type\n            weight: (float)\
        \ the percent weight the given assigment type has on the overall grade\n \
        \       grade_range: an object containing the grade range cutoffs. The exact\
        \ keys in the object can vary, but they\n                     range from just\
        \ 'Pass', to a combination of 'A', 'B', 'C', and 'D'. If a letter grade is\n\
        \                     present, 'Pass' is not included.\n    has_scheduled_content:\
        \ (bool) boolean on if the course has content scheduled with a release date\
        \ in the future\n    section_scores: List of serialized Chapters. Each Chapter\
        \ has the following fields:\n        display_name: (str) a str of what the\
        \ name of the Chapter is for displaying on the site\n        subsections:\
        \ List of serialized Subsections, each has the following fields:\n       \
        \     assignment_type: (str) the format, if any, of the Subsection (Homework,\
        \ Exam, etc)\n            block_key: (str) the key of the given subsection\
        \ block\n            display_name: (str) a str of what the name of the Subsection\
        \ is for displaying on the site\n            has_graded_assignment: (bool)\
        \ whether or not the Subsection is a graded assignment\n            learner_has_access:\
        \ (bool) whether the learner has access to the subsection (could be FBE gated)\n\
        \            num_points_earned: (int) the amount of points the user has earned\
        \ for the given subsection\n            num_points_possible: (int) the total\
        \ amount of points possible for the given subsection\n            override:\
        \ Optional object if grade has been overridden by proctor or grading change\n\
        \                system: (str) either GRADING or PROCTORING\n            \
        \    reason: (str) a comment on the grading override\n            percent_graded:\
        \ (float) the percentage of total points the user has received a grade for\
        \ in a given\n                            subsection\n            problem_scores:\
        \ List of objects that represent individual problem scores with the following\
        \ fields:\n                earned: (float) number of earned points\n     \
        \           possible: (float) number of possible points\n            show_correctness:\
        \ (str) a str representing whether to show the problem/practice scores based\
        \ on due date\n                              ('always', 'never', 'past_due',\
        \ values defined in\n                               xmodule/modulestore/inheritance.py)\n\
        \            show_grades: (bool) a bool for whether to show grades based on\
        \ the access the user has\n            url: (str or None) the absolute path\
        \ url to the Subsection or None if the Subsection is no longer\n         \
        \        accessible to the learner due to a hide_after_due course team setting\n\
        \    studio_url: (str) a str of the link to the grading in studio for the\
        \ course\n    user_has_passing_grade: (bool) boolean on if the user has a\
        \ passing grade in the course\n    username: (str) username of the student\
        \ whose progress information is being displayed.\n    verification_data: an\
        \ object containing\n        link: (str) the link to either start or retry\
        \ ID verification\n        status: (str) the status of the ID verification\n\
        \        status_date: (str) the date time string of when the ID verification\
        \ status was set\n\n**Returns**\n\n    * 200 on success with above fields.\n\
        \    * 401 if the user is not authenticated or not enrolled.\n    * 403 if\
        \ the user does not have access to the course.\n    * 404 if the course is\
        \ not available or cannot be seen."
      tags:
      - course_home
      parameters:
      - name: course_key_string
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressTab'
