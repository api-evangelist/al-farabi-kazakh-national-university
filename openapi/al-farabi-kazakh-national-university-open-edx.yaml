  /course_home/unsubscribe_from_course_goal/{token}:
    post:
      operationId: course_home_unsubscribe_from_course_goal_create
      summary: API calls to unsubscribe from course goal reminders.
      description: "Note that this does not require authentication - this view may\
        \ be hit from an email on a different device than\nnormal or whatever. We\
        \ should still be able to unsubscribe the user. Instead, we use a token in\
        \ the email to\nvalidate that they have permission to unsubscribe.\n\nThis\
        \ endpoint is very tightly scoped (only unsubscribe: no subscribing, no PII)\
        \ because it is unauthenticated.\n\n**Example Requests**\n    POST api/course_home/v1/unsubscribe_from_course_goal/{token}\n\
        \n**Example Response Data**\n    {'course_title': 'Cats & Dogs In Canadian\
        \ Media'}\n\nReturns a 404 response if the token was not found. Otherwise,\
        \ returns some basic course info. But no PII."
      tags:
      - course_home
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
