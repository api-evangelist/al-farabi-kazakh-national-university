  /enrollment/v1/enrollments/:
    get:
      operationId: enrollment_v1_enrollments_list
      summary: '**Use Cases**'
      description: "Get a list of all course enrollments, optionally filtered by a\
        \ course ID or list of usernames.\n\n**Example Requests**\n\n    GET /api/enrollment/v1/enrollments\n\
        \n    GET /api/enrollment/v1/enrollments?course_id={course_id}\n\n    GET\
        \ /api/enrollment/v1/enrollments?username={username},{username},{username}\n\
        \n    GET /api/enrollment/v1/enrollments?course_id={course_id}&username={username}\n\
        \n    GET /api/enrollment/v1/enrollments?email={email},{email}\n\n**Query\
        \ Parameters for GET**\n\n    * course_id: Filters the result to course enrollments\
        \ for the course corresponding to the\n      given course ID. The value must\
        \ be URL encoded. Optional.\n\n    * username: List of comma-separated usernames.\
        \ Filters the result to the course enrollments\n      of the given users.\
        \ Optional.\n\n    * email: List of comma-separated emails. Filters the result\
        \ to the course enrollments\n      of the given users. Optional.\n\n    *\
        \ page_size: Number of results to return per page. Optional.\n\n    * page:\
        \ Page number to retrieve. Optional.\n\n**Response Values**\n\n    If the\
        \ request for information about the course enrollments is successful, an HTTP\
        \ 200 \"OK\" response\n    is returned.\n\n    The HTTP 200 response has the\
        \ following values.\n\n    * results: A list of the course enrollments matching\
        \ the request.\n\n        * created: Date and time when the course enrollment\
        \ was created.\n\n        * mode: Mode for the course enrollment.\n\n    \
        \    * is_active: Whether the course enrollment is active or not.\n\n    \
        \    * user: Username of the user in the course enrollment.\n\n        * course_id:\
        \ Course ID of the course in the course enrollment.\n\n    * next: The URL\
        \ to the next page of results, or null if this is the\n      last page.\n\n\
        \    * previous: The URL to the next page of results, or null if this\n  \
        \    is the first page.\n\n    If the user is not logged in, a 401 error is\
        \ returned.\n\n    If the user is not global staff, a 403 error is returned.\n\
        \n    If the specified course_id is not valid or any of the specified usernames\n\
        \    are not valid, a 400 error is returned.\n\n    If the specified course_id\
        \ does not correspond to a valid course or if all the specified\n    usernames\
        \ do not correspond to valid users, an HTTP 200 \"OK\" response is returned\
        \ with an\n    empty 'results' field."
      tags:
      - enrollment
      parameters:
      - name: cursor
        in: query
        required: false
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        in: query
        required: false
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - results
                type: object
                properties:
                  next:
                    type: string
                    format: uri
                    nullable: true
                  previous:
                    type: string
                    format: uri
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseEnrollmentsApiList'
  /enrollment/v1/roles/:
    get:
      operationId: enrollment_v1_roles_list
