  /mobile/{api_version}/course_info/blocks/:
    get:
      operationId: mobile_course_info_blocks_list
      summary: '**Use Case**'
      description: "This API endpoint is specifically optimized for the course homepage\
        \ on Mobile Apps.\n    The endpoint returns the blocks in the course according\
        \ to the requesting user's access level.\n    Additionally, response encompasses\
        \ info fields with information about the course,\n    including certificate\
        \ URL, media dictionary with course image URLs, start and end dates for the\
        \ course.\n\n**Example requests**:\n\n    This api works with all versions\
        \ {api_version}, you can use: v0.5, v1, v2 or v3\n\n    GET /api/mobile/{api_version}/course_info/blocks/?course_id=<course_id>\n\
        \    GET /api/mobile/{api_version}/course_info/blocks/?course_id=<course_id>\n\
        \        &username=anjali\n        &depth=all\n        &requested_fields=graded,format,student_view_multi_device,lti_url\n\
        \        &block_counts=video\n        &student_view_data=video\n        &block_types_filter=problem,html\n\
        \n**Parameters:**\n\n        username (str): The username of the specified\
        \ user for whom the course data\n            is being accessed.\n        depth\
        \ (integer, str, None): Optional number of blocks you receive in response\n\
        \            course nesting depth, you can get only sections, sections and\
        \ subsections,\n            or provide string 'all' to receive all blocks\
        \ of the course.\n        requested_field (list): Optional list of names of\
        \ additional fields to return for each block.\n            Supported fields\
        \ can be found in transformers.SUPPORTED_FIELDS.\n        block_counts (list):\
        \ Optional list of names of block types for which an aggregated count\n  \
        \          of blocks is returned.\n        student_view_data (list): Optional\
        \ list of names of block types for\n            which student_view_data is\
        \ returned.\n        block_types_filter (list): Filter by block types:\n \
        \           'video', 'discussion', 'html', 'chapter', 'sequential', 'vertical'.\n\
        \        return_type (list, dict): Optional list or dictionary of block's\
        \ fields based on 'return_type'.\n\n**Response example**\n\n    Body consists\
        \ of the following fields, you received this response if you use\n    'return_type=dict'\
        \ in query params:\n\n    root: (str) The ID of the root node of the requested\
        \ course block structure.        blocks: (dict) A dictionary or list, based\
        \ on the value of the\n        \"return_type\" parameter. Maps block usage\
        \ IDs to a collection of\n        information about each block. Each block\
        \ contains the following\n        fields.\n\n    id: (str) The Course's id\
        \ (Course Run key)\n    name: (str) The course's name\n    number: (str) The\
        \ course's number\n    org: (str) The course's organisation\n    start: (str)\
        \ Date the course begins, in ISO 8601 notation\n    start_display: (str) Readably\
        \ formatted start of the course\n    start_type: (str) Hint describing how\
        \ `start_display` is set. One of:\n        * `\"string\"`: manually set by\
        \ the course author\n        * `\"timestamp\"`: generated from the `start`\
        \ timestamp\n        * `\"empty\"`: no start date is specified\n    end: (str)\
        \ Date the course ends, in ISO 8601 notation\n    media: (dict) An object\
        \ that contains named media items. Included here:\n        * course_image:\
        \ An image to show for the course.  Represented\n          as an object with\
        \ the following fields:\n            * uri: The location of the image\n  \
        \  certificate: (dict) Information about the user's earned certificate in\
        \ the course.\n        Included here:\n            * uri: The location of\
        \ the user's certificate\n    is_self_paced: (bool) Indicates if the course\
        \ is self paced\n\n    Body consists of the following fields, you received\
        \ this response if you use\n    'return_type=list' in query params:\n\n  \
        \  id: (str) The Course's id (Course Run key)\n    block_id: (str) The unique\
        \ identifier for the block_id\n    lms_web_url: (str) The URL to the navigational\
        \ container of the xBlock on the web.\n    legacy_web_url: (str) Like `lms_web_url`,\
        \ but always directs to\n        the \"Legacy\" frontend experience.\n   \
        \ student_view_url: (str) The URL to retrieve the HTML rendering\n       \
        \ of this block's student view\n    type: (str): The type of block. Possible\
        \ values the names of any\n        XBlock type in the system, including custom\
        \ blocks. Examples are\n        course, chapter, sequential, vertical, html,\
        \ problem, video, and\n        discussion.\n    display_name: (str) The display\
        \ name of the block.\n    course_progress: (dict) Contains information about\
        \ how many assignments are in the course\n        and how many assignments\
        \ the student has completed.\n        Included here:\n            * total_assignments_count:\
        \ (int) Total course's assignments count.\n            * assignments_completed:\
        \ (int) Assignments witch the student has completed.\n\n**Returns**\n\n  \
        \  * 200 on success with above fields.\n    * 400 if an invalid parameter\
        \ was sent or the username was not provided\n    * 401 unauthorized, the provided\
        \ access token has expired and is no longer valid\n      for an authenticated\
        \ request.\n    * 403 if a user who does not have permission to masquerade\
        \ as\n      another user specifies a username other than their own.\n    *\
        \ 404 if the course is not available or cannot be seen."
      tags:
      - mobile
      parameters:
      - name: api_version
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: ''
