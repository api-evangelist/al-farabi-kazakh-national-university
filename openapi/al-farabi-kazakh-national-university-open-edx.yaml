  /courseware/course/{course_key_string}:
    get:
      operationId: courseware_course_read
      summary: '**Use Cases**'
      description: "Request details for a course\n\n**Example Requests**\n\n    GET\
        \ /api/courseware/course/{course_key}\n\n**Response Values**\n\n    Body consists\
        \ of the following fields:\n\n    * access_expiration: An object detailing\
        \ when access to this course will expire\n        * expiration_date: (str)\
        \ When the access expires, in ISO 8601 notation\n        * masquerading_expired_course:\
        \ (bool) Whether this course is expired for the masqueraded user\n       \
        \ * upgrade_deadline: (str) Last chance to upgrade, in ISO 8601 notation (or\
        \ None if can't upgrade anymore)\n        * upgrade_url: (str) Upgrade linke\
        \ (or None if can't upgrade anymore)\n    * celebrations: An object detailing\
        \ which celebrations to render\n        * first_section: (bool) If the first\
        \ section celebration should render\n            Note: Also uses information\
        \ from frontend so this value is not final\n        * streak_length_to_celebrate:\
        \ (int) The streak length to celebrate for the learner\n        * streak_discount_enabled:\
        \ (bool) If the frontend should render an upgrade discount for hitting the\
        \ streak\n        * weekly_goal: (bool) If the weekly goal celebration should\
        \ render\n    * course_goals:\n        * selected_goal:\n            * days_per_week:\
        \ (int) The number of days the learner wants to learn per week\n         \
        \   * subscribed_to_reminders: (bool) Whether the learner wants email reminders\
        \ about their goal\n        * weekly_learning_goal_enabled: Flag indicating\
        \ if this feature is enabled for this call\n    * effort: A textual description\
        \ of the weekly hours of effort expected\n        in the course.\n    * end:\
        \ Date the course ends, in ISO 8601 notation\n    * enrollment: Enrollment\
        \ status of authenticated user\n        * mode: `audit`, `verified`, etc\n\
        \        * is_active: boolean\n    * enrollment_end: Date enrollment ends,\
        \ in ISO 8601 notation\n    * enrollment_start: Date enrollment begins, in\
        \ ISO 8601 notation\n    * entrance_exam_data: An object containing information\
        \ about the course's entrance exam\n        * entrance_exam_current_score:\
        \ (float) The users current score on the entrance exam\n        * entrance_exam_enabled:\
        \ (bool) If the course has an entrance exam\n        * entrance_exam_id: (str)\
        \ The block id for the entrance exam if enabled. Will be a section (chapter)\n\
        \        * entrance_exam_minimum_score_pct: (float) The minimum score a user\
        \ must receive on the entrance exam\n            to unlock the remainder of\
        \ the course. Returned as a float (i.e. 0.7 for 70%)\n        * entrance_exam_passed:\
        \ (bool) Indicates if the entrance exam has been passed\n    * id: A unique\
        \ identifier of the course; a serialized representation\n        of the opaque\
        \ key identifying the course.\n    * language: The language code for the course\n\
        \    * media: An object that contains named media items.  Included here:\n\
        \        * course_image: An image to show for the course.  Represented\n \
        \         as an object with the following fields:\n            * uri: The\
        \ location of the image\n    * name: Name of the course\n    * offer: An object\
        \ detailing upgrade discount information\n        * code: (str) Checkout code\n\
        \        * expiration_date: (str) Expiration of offer, in ISO 8601 notation\n\
        \        * original_price: (str) Full upgrade price without checkout code;\
        \ includes currency symbol\n        * discounted_price: (str) Upgrade price\
        \ with checkout code; includes currency symbol\n        * percentage: (int)\
        \ Amount of discount\n        * upgrade_url: (str) Checkout URL\n    * org:\
        \ Name of the organization that owns the course\n    * related_programs: A\
        \ list of objects that contains program data related to the given course including:\n\
        \        * progress: An object containing program progress:\n            *\
        \ complete: (int) Number of complete courses in the program (a course is completed\
        \ if the user has\n                earned a certificate for any of the nested\
        \ course runs)\n            * in_progress: (int) Number of courses in the\
        \ program that are in progress (a course is in progress if\n             \
        \   the user has enrolled in any of the nested course runs)\n            *\
        \ not_started: (int) Number of courses in the program that have not been started\n\
        \        * slug: (str) The program type\n        * title: (str) The title\
        \ of the program\n        * url: (str) The link to the program's landing page\n\
        \        * uuid: (str) A unique identifier of the program\n    * short_description:\
        \ A textual description of the course\n    * start: Date the course begins,\
        \ in ISO 8601 notation\n    * start_display: Readably formatted start of the\
        \ course\n    * start_type: Hint describing how `start_display` is set. One\
        \ of:\n        * `\"string\"`: manually set by the course author\n       \
        \ * `\"timestamp\"`: generated from the `start` timestamp\n        * `\"empty\"\
        `: no start date is specified\n    * pacing: Course pacing. Possible values:\
        \ instructor, self\n    * user_timezone: User's chosen timezone setting (or\
        \ null for browser default)\n    * user_has_passing_grade: Whether or not\
        \ the effective user's grade is equal to or above the courses minimum\n  \
        \      passing grade\n    * course_exit_page_is_active: Flag for the learning\
        \ mfe on whether or not the course exit page should display\n    * certificate_data:\
        \ data regarding the effective user's certificate for the given course\n \
        \   * verify_identity_url: URL for a learner to verify their identity. Only\
        \ returned for learners enrolled in a\n        verified mode. Will update\
        \ to reverify URL if necessary.\n    * linkedin_add_to_profile_url: URL to\
        \ add the effective user's certificate to a LinkedIn Profile.\n    * user_needs_integrity_signature:\
        \ Whether the user needs to sign the integrity agreement for the course\n\
        \    * learning_assistant_enabled: Whether the Xpert Learning Assistant is\
        \ enabled for the requesting user\n\n**Parameters:**\n\n    requested_fields\
        \ (optional) comma separated list:\n        If set, then only those fields\
        \ will be returned.\n    username (optional) username to masquerade as (if\
        \ requesting user is staff)\n\n**Returns**\n\n    * 200 on success with above\
        \ fields.\n    * 400 if an invalid parameter was sent or the username was\
        \ not provided\n      for an authenticated request.\n    * 403 if a user who\
        \ does not have permission to masquerade as\n      another user specifies\
        \ a username other than their own.\n    * 404 if the course is not available\
        \ or cannot be seen."
      tags:
      - courseware
      parameters:
      - name: course_key_string
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseInfo'
