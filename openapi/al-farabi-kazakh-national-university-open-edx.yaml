  /mobile/{api_version}/notifications/create-token/:
    post:
      operationId: mobile_notifications_create-token_create
      summary: "**Use Case**\n    This endpoint allows clients to register a device\
        \ for push notifications."
      description: "If the device is already registered, the existing registration\
        \ will be updated.\n    If setting PUSH_NOTIFICATIONS_SETTINGS is not configured,\
        \ the endpoint will return a 501 error.\n\n**Example Request**\n    POST /api/mobile/{version}/notifications/create-token/\n\
        \    **POST Parameters**\n      The body of the POST request can include the\
        \ following parameters.\n      * name (optional) - A name of the device.\n\
        \      * registration_id (required) - The device token of the device.\n  \
        \    * device_id (optional) - ANDROID_ID / TelephonyManager.getDeviceId()\
        \ (always as hex)\n      * active (optional) - Whether the device is active,\
        \ default is True.\n        If False, the device will not receive notifications.\n\
        \      * cloud_message_type (required) - You should choose FCM or GCM. Currently,\
        \ only FCM is supported.\n      * application_id (optional) - Opaque application\
        \ identity, should be filled in for multiple\n        key/certificate access.\
        \ Should be equal settings.FCM_APP_NAME.\n**Example Response**\n    ```json\n\
        \    {\n        \"id\": 1,\n        \"name\": \"My Device\",\n        \"registration_id\"\
        : \"fj3j4\",\n        \"device_id\": 1234,\n        \"active\": true,\n  \
        \      \"date_created\": \"2024-04-18T07:39:37.132787Z\",\n        \"cloud_message_type\"\
        : \"FCM\",\n        \"application_id\": \"my_app_id\"\n    }\n    ```"
      tags:
      - mobile
      parameters:
      - name: api_version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GCMDevice'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GCMDevice'
  /mobile/{api_version}/users/{username}:
    get:
      operationId: mobile_users_read
      summary: '**Use Case**'
      description: "Get information about the specified user and access other resources\n\
        \    the user has permissions for.\n\n    Users are redirected to this endpoint\
        \ after they sign in.\n\n    You can use the **course_enrollments** value\
        \ in the response to get a\n    list of courses the user is enrolled in.\n\
        \n**Example Request**\n\n    GET /api/mobile/{version}/users/{username}\n\n\
        **Response Values**\n\n    If the request is successful, the request returns\
        \ an HTTP 200 \"OK\" response.\n\n    The HTTP 200 response has the following\
        \ values.\n\n    * course_enrollments: The URI to list the courses the currently\
        \ signed\n      in user is enrolled in.\n    * email: The email address of\
        \ the currently signed in user.\n    * id: The ID of the user.\n    * name:\
        \ The full name of the currently signed in user.\n    * username: The username\
        \ of the currently signed in user."
      tags:
      - mobile
      parameters:
      - name: api_version
        in: path
        required: true
        schema:
          type: string
      - name: username
        in: path
        required: true
        description: Обязательное поле. Не более 150 символов. Только буквы, цифры
          и символы @/./+/-/_.
        schema:
          type: string
          pattern: ^[\w.@+-]+$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mobile_api.User'
  /mobile/{api_version}/users/{username}/course_enrollments/:
    get:
      operationId: mobile_users_course_enrollments_list
      summary: '**Use Case**'
      description: "Get information about the courses that the currently signed in\
        \ user is\n    enrolled in.\n\n    v1 differs from v0.5 version by returning\
        \ ALL enrollments for\n    a user rather than only the enrollments the user\
        \ has access to (that haven't expired).\n    An additional attribute \"expiration\"\
        \ has been added to the response, which lists the date\n    when access to\
        \ the course will expire or null if it doesn't expire.\n\n    In v4 we added\
        \ to the response primary object. Primary object contains the latest user's\
        \ enrollment\n    or course where user has the latest progress. Primary object\
        \ has been cut from user's\n    enrolments array and inserted into separated\
        \ section with key `primary`.\n\n**Example Request**\n\n    GET /api/mobile/v1/users/{username}/course_enrollments/\n\
        \n**Response Values**\n\n    If the request for information about the user\
        \ is successful, the\n    request returns an HTTP 200 \"OK\" response.\n\n\
        \    The HTTP 200 response has the following values.\n\n    * expiration:\
        \ The course expiration date for given user course pair\n      or null if\
        \ the course does not expire.\n    * certificate: Information about the user's\
        \ earned certificate in the\n      course.\n    * course: A collection of\
        \ the following data about the course.\n\n    * courseware_access: A JSON\
        \ representation with access information for the course,\n      including\
        \ any access errors.\n\n      * course_about: The URL to the course about\
        \ page.\n      * course_sharing_utm_parameters: Encoded UTM parameters to\
        \ be included in course sharing url\n      * course_handouts: The URI to get\
        \ data for course handouts.\n      * course_image: The path to the course\
        \ image.\n      * course_updates: The URI to get data for course updates.\n\
        \      * discussion_url: The URI to access data for course discussions if\n\
        \        it is enabled, otherwise null.\n      * end: The end date of the\
        \ course.\n      * id: The unique ID of the course.\n      * name: The name\
        \ of the course.\n      * number: The course number.\n      * org: The organization\
        \ that created the course.\n      * start: The date and time when the course\
        \ starts.\n      * start_display:\n        If start_type is a string, then\
        \ the advertised_start date for the course.\n        If start_type is a timestamp,\
        \ then a formatted date for the start of the course.\n        If start_type\
        \ is empty, then the value is None and it indicates that the course has not\
        \ yet started.\n      * start_type: One of either \"string\", \"timestamp\"\
        , or \"empty\"\n      * subscription_id: A unique \"clean\" (alphanumeric\
        \ with '_') ID of\n        the course.\n      * video_outline: The URI to\
        \ get the list of all videos that the user\n        can access in the course.\n\
        \n    * created: The date the course was created.\n    * is_active: Whether\
        \ the course is currently active. Possible values\n      are true or false.\n\
