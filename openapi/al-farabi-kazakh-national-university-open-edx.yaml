components:
  schemas:
    Bookmark:
      required:
      - course_id
      - usage_id
      type: object
      properties:
        id:
          title: Id
          description: 'The identifier string for the bookmark: {user_id},{usage_id}.'
          type: string
          readOnly: true
        course_id:
          title: Course id
          description: The identifier string of the bookmark's course.
          type: string
        usage_id:
          title: Usage id
          description: The identifier string of the bookmark's XBlock.
          type: string
        block_type:
          title: Block type
          type: string
          readOnly: true
        created:
          title: Создано
          type: string
          format: date-time
          readOnly: true
    CohortUsersAPI:
      required:
      - username
      type: object
      properties:
        username:
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
          minLength: 1
        email:
          title: Адрес электронной почты
          type: string
          format: email
          maxLength: 254
        name:
          title: Name
          type: string
          readOnly: true
    commerce.CourseMode:
      required:
      - name
      - price
      type: object
      properties:
        name:
          title: Name
          type: string
          minLength: 1
        currency:
          title: Currency
          type: string
          maxLength: 8
          minLength: 1
        price:
          title: Price
          type: integer
        sku:
          title: SKU
          description: 'НЕОБЯЗАТЕЛЬНО: поле SKU (единица учёта запасов) для внешнего
            сервиса электронной коммерции. Оставьте пустым, если курс ещё не был добавлен
            в сервис электронной коммерции.'
          type: string
          maxLength: 255
          nullable: true
        bulk_sku:
          title: Bulk SKU
          description: Это основная часть SKU (единица учёта запасов) этого режима
            в службе внешней электронной коммерции.
          type: string
          maxLength: 255
          nullable: true
        expires:
          title: Expires
          type: string
          format: date-time
          nullable: true
        android_sku:
          title: Android SKU
          description: 'OPTIONAL: This is the Android SKU registered on play store
            for this mode of the course. Leave this blank if the course has not yet
            been migrated to the ecommerce service.'
          type: string
          maxLength: 255
          nullable: true
        ios_sku:
          title: IOS SKU
          description: 'OPTIONAL: This is the iOS SKU registered on app store for
            this mode of the course.  Leave this blank if the course has not yet been
            migrated to the ecommerce service.'
          type: string
          maxLength: 255
          nullable: true
    commerce.Course:
      required:
      - id
      - modes
      type: object
      properties:
        id:
          title: Id
          type: string
          minLength: 1
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        verification_deadline:
          title: Verification deadline
          type: string
          format: date-time
          nullable: true
        modes:
          type: array
          items:
            $ref: '#/components/schemas/commerce.CourseMode'
    CourseDeadlinesMobile:
      type: object
      properties:
        dates_banner_info:
          title: Dates banner info
          type: string
          readOnly: true
        has_ended:
          title: Has ended
          type: string
          readOnly: true
    CourseTab:
      required:
      - tab_id
      type: object
      properties:
        tab_id:
          title: Tab id
          type: string
          minLength: 1
        title:
          title: Title
          type: string
          readOnly: true
        url:
          title: Url
          type: string
          readOnly: true
    CourseModeSerrializer:
      required:
      - slug
      - name
      type: object
      properties:
        slug:
          title: Slug
          type: string
          minLength: 1
        name:
          title: Name
          type: string
          minLength: 1
    CourseHomeMetadata:
      required:
      - celebrations
      - course_access
      - studio_access
      - course_id
      - is_enrolled
      - is_self_paced
      - is_staff
      - number
      - org
      - original_user_is_staff
      - start
      - tabs
      - title
      - username
      - user_timezone
      - can_view_certificate
      - course_modes
      - is_new_discussion_sidebar_view_enabled
      - has_course_author_access
      type: object
      properties:
        verified_mode:
          title: Verified mode
          type: string
          readOnly: true
        celebrations:
          title: Celebrations
          type: object
          additionalProperties:
            type: string
            nullable: true
        course_access:
          title: Course access
          type: object
          additionalProperties:
            type: string
            nullable: true
        studio_access:
          title: Studio access
          type: boolean
        course_id:
          title: Course id
          type: string
          minLength: 1
        is_enrolled:
          title: Is enrolled
          type: boolean
        is_self_paced:
          title: Is self paced
          type: boolean
        is_staff:
          title: Is staff
          type: boolean
        number:
          title: Number
          type: string
          minLength: 1
        org:
          title: Org
          type: string
          minLength: 1
        original_user_is_staff:
          title: Original user is staff
          type: boolean
        start:
          title: Start
          type: string
          format: date-time
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/CourseTab'
        title:
          title: Title
          type: string
          minLength: 1
        username:
          title: Username
          type: string
          minLength: 1
        user_timezone:
          title: User timezone
          type: string
          minLength: 1
        can_view_certificate:
          title: Can view certificate
          type: boolean
        course_modes:
          type: array
          items:
            $ref: '#/components/schemas/CourseModeSerrializer'
        is_new_discussion_sidebar_view_enabled:
          title: Is new discussion sidebar view enabled
          type: boolean
        has_course_author_access:
          title: Has course author access
          type: boolean
    DateSummary:
      required:
      - complete
      - date
      - date_type
      - description
      - link_text
      - title
      - extra_info
      type: object
      properties:
        assignment_type:
