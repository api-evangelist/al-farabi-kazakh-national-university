  /edx_name_affirmation/v1/verified_name:
    get:
      operationId: edx_name_affirmation_v1_verified_name_list
      summary: Get most recent verified name for the request user or for the specified
        username
      description: "For example: /edx_name_affirmation/v1/verified_name?username=jdoe\n\
        Example response: {\n    \"username\": \"jdoe\",\n    \"verified_name\": \"\
        Jonathan Doe\",\n    \"profile_name\": \"Jon Doe\",\n    \"verification_attempt_id\"\
        : 123,\n    \"proctored_exam_attempt_id\": None,\n    \"status\": \"approved\"\
        ,\n    \"use_verified_name_for_certs\": False,\n}"
      tags:
      - edx_name_affirmation
      parameters:
      - name: username
        in: query
        required: false
        description: The username of which verified name records might be associated
        schema:
          type: string
      responses:
        '200':
          description: The verified_name record associated with the username provided
        '403':
          description: User lacks required permission. Only an edX staff user can
            invoke this API
        '404':
          description: The verified_name record associated with the username provided
            does not exist.
    post:
      operationId: edx_name_affirmation_v1_verified_name_create
      summary: Creates a new VerifiedName.
      description: "Expected POST data: {\n    \"username\": \"jdoe\",\n    \"verified_name\"\
        : \"Jonathan Doe\"\n    \"profile_name\": \"Jon Doe\"\n    \"verification_attempt_id\"\
        : (Optional)\n    \"proctored_exam_attempt_id\": (Optional)\n    \"platform_verification_attempt_id\"\
        : (Optional)\n    \"status\": (Optional)\n}"
      tags:
      - edx_name_affirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiedName'
      responses:
        '200':
          description: The verified_name record associated with the username provided
            is successfully created
        '403':
          description: User lacks required permission. Only an edX staff user can
            invoke this API
        '400':
          description: The posted data have conflicts with already stored verified
