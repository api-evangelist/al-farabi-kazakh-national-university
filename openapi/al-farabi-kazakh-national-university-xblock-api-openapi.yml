        schema:
          type: string
      responses:
        '200':
          description: ''
  /xblock/v2/xblocks/{usage_key}@{version}/olx/:
    get:
      operationId: xblock_v2_xblocks_olx_list
      description: Get the OLX (XML serialization) of the specified XBlock
